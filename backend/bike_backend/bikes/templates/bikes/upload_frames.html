{% extends "admin/base_site.html" %}
{% block content %}
<h1>Upload 360° frames — {{ variant }}</h1>
<p>Currently has {{ variant.frame_count }} frame(s). Uploading a new set replaces all existing frames for this colour.
</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Upload frames" class="default" />
</form>
{% endblock %}
